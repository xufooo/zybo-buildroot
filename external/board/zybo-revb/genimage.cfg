# ============================================================================
# genimage.cfg — SD card partition layout for ZYBO Rev B
# ============================================================================
# Creates a bootable SD card image with:
#   Partition 1: FAT32 (boot) — BOOT.BIN, uImage, boot.scr
#   Partition 2: ext4  (root) — root filesystem
# ============================================================================
# This is the layout template for the released FSBL form: BOOT.BIN bundles the
# FSBL + PL bitstream + U-Boot and the boot partition holds exactly these three
# files. zybo-audio.dtb belongs to the historical/optional SPL form (the DTB is
# embedded in uImage as a FIT), so it is not listed here.
# ============================================================================

image sdcard.img {
    hdimage {
        # 1 GB card image
        gpt = false
    }

    # FAT32 boot partition
    partition boot {
        partition-type = 0xC
        bootable = true
        size = 64M
        image = "boot.vfat"
    }

    # ext4 root filesystem
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}

image boot.vfat {
    vfat {
        files = {
            "BOOT.BIN",
            "uImage",
            "boot.scr",
        }
    }
    size = 64M
}

image rootfs.ext4 {
    ext4 {
        label = "rootfs"
    }
    size = 256M
}
