# ============================================================================
# build-rootfs.yml — ZYBO Rev B 音频 Linux（Buildroot）GitHub Actions 构建
# ============================================================================
# 产物（artifact: linux-images）：
#   boot.bin（=BOOT.BIN, U-Boot SPL）、u-boot.img、uImage、zybo-audio.dtb、
#   rootfs.ext4、rootfs.tar
# 说明：
#   - Buildroot 2026.02.3（LTS）+ BR2_EXTERNAL=external（本仓库根）
#   - 外部预编译工具链（Bootlin armv7-eabihf glibc stable）→ 跳过自建 gcc/glibc
#   - Phase-1 精简包：alsa-utils + i2c-tools（MPD/AirPlay 后续增量加）
#   - bitstream 不在 CI 生成（需 Vivado）：产物下载后本地 `make bootbin --bit ...` 组卡
#   - runner: ubuntu-24.04（tar 1.35，满足 Buildroot ≥1.35 要求，免自建 host-tar）
# ============================================================================
name: Build ZYBO Linux Rootfs (Buildroot)

on:
  workflow_dispatch:
  push:
    paths:
      - 'external/**'
      - 'buildroot_setup.sh'
      - '.github/workflows/build-rootfs.yml'

concurrency:
  group: zybo-buildroot
  cancel-in-progress: true

env:
  BUILDROOT_VERSION: '2026.02.3'
  BR_DIR: buildroot
  DL_DIR: ${{ github.workspace }}/br2-dl

jobs:
  build:
    name: Build Buildroot image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DTS/config sync with zybo-linux (canonical)
        run: |
          # external/overlays/zybo-audio.dts 与 external/board/zybo-revb/linux.fragment
          # 都是 zybo-linux 仓里同名文件的副本（保留副本 = 构建自包含/可复现）。
          # 权威版本在 zybo-linux，这里做漂移检测：2026-09-10 曾因 DTS 副本不同步
          # （缺 interrupt-parent / clocks）导致 CI 编出的 DTB 上板后 codec 不 probe。
          fetch() {
            curl -fsSL -o "/tmp/canonical-$1" \
              "https://raw.githubusercontent.com/xufooo/zybo-linux/main/kernel/$1"
          }
          fail=0
          # DTS：去掉注释与空行再比（副本头部多一段说明）
          fetch zybo-audio.dts
          strip() { grep -v '^[[:space:]]*//' "$1" | grep -v '^[[:space:]]*$'; }
          if ! diff -u <(strip /tmp/canonical-zybo-audio.dts) \
                       <(strip external/overlays/zybo-audio.dts); then
            echo "::error::external/overlays/zybo-audio.dts 与 zybo-linux 权威版本已漂移，请同步"
            fail=1
          fi
          # fragment：应当逐字节一致
          fetch config.fragment
          if ! diff -u /tmp/canonical-config.fragment \
                       external/board/zybo-revb/linux.fragment; then
            echo "::error::external/board/zybo-revb/linux.fragment 与 zybo-linux 权威版本已漂移，请同步"
            fail=1
          fi
          [ "$fail" = "0" ] && echo "DTS 与 config fragment 均与 zybo-linux 权威版本一致"
          exit $fail

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio file flex git libncurses-dev \
            libssl-dev python3 rsync unzip wget

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.DL_DIR }}
          key: br2-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('external/configs/*') }}
          restore-keys: br2-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Clone Buildroot
        run: |
          git clone --depth 1 --branch $BUILDROOT_VERSION \
            https://github.com/buildroot/buildroot.git $BR_DIR

      - name: Configure (BR2_EXTERNAL + defconfig)
        run: |
          cd $BR_DIR
          make BR2_EXTERNAL=$GITHUB_WORKSPACE/external \
               BR2_DL_DIR=$DL_DIR \
               zybo_revb_audio_defconfig
          grep -E 'BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_ARMV7|BR2_TARGET_UBOOT_BOARD_DEFCONFIG|BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION|BR2_TARGET_UBOOT_SPL_NAME' .config

      - name: Fix script permissions
        run: |
          # git 可能丢失可执行位；Buildroot 直接执行 post-build 脚本，必须可执行
          chmod +x external/board/zybo-revb/post-build.sh buildroot_setup.sh make_bootbin.sh 2>/dev/null || true
          ls -l external/board/zybo-revb/post-build.sh

      - name: Build
        run: |
          cd $BR_DIR
          make BR2_DL_DIR=$DL_DIR -j$(nproc)

      - name: List images
        run: ls -la $BR_DIR/output/images/

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-images
          path: |
            ${{ env.BR_DIR }}/output/images/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.BR_DIR }}/output/build/*/build.log
            ${{ env.BR_DIR }}/output/build/*/config.log
          if-no-files-found: ignore
          retention-days: 7
