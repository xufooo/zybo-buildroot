# ============================================================================
# build-rootfs.yml — ZYBO Rev B audio Linux (Buildroot) GitHub Actions build
# ============================================================================
# Build artifacts (artifact: linux-images):
#   boot.bin (the U-Boot SPL's spl/boot.bin; this is the SPL boot route),
#   u-boot.img, uImage, zybo-audio.dtb, rootfs.ext4, rootfs.tar
# The published image uses the FSBL form instead: BOOT.BIN = FSBL + PL bitstream +
# U-Boot, assembled with Vivado + bootgen, and the boot partition holds BOOT.BIN,
# uImage and boot.scr.
# Notes:
#   - Buildroot 2026.02.3 (LTS) + BR2_EXTERNAL=external (repository root)
#   - prebuilt external toolchain (Bootlin armv7-eabihf glibc stable), so no
#     self-built gcc/glibc
#   - Phase-1 minimal package set: alsa-utils + i2c-tools (MPD/AirPlay added later)
#   - the bitstream is not produced in CI (it needs Vivado): download the artifacts
#     and assemble the card locally with `make_bootbin.sh --bit ...`
#   - runner: ubuntu-24.04 (tar 1.35, meeting Buildroot's >=1.35 requirement, so no
#     self-built host-tar)
# ============================================================================
name: Build ZYBO Linux Rootfs (Buildroot)

on:
  workflow_dispatch:
  push:
    paths:
      - 'external/**'
      - 'buildroot_setup.sh'
      - '.github/workflows/build-rootfs.yml'

concurrency:
  group: zybo-buildroot
  cancel-in-progress: true

env:
  BUILDROOT_VERSION: '2026.02.3'
  BR_DIR: buildroot
  DL_DIR: ${{ github.workspace }}/br2-dl

jobs:
  build:
    name: Build Buildroot image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DTS/config sync with zybo-linux (canonical)
        run: |
          # external/overlays/zybo-audio.dts and external/board/zybo-revb/linux.fragment
          # are copies of the same-named files in the zybo-linux repository (keeping
          # copies makes the build self-contained/reproducible). zybo-linux is
          # canonical; this step detects drift, because a stale DTS copy (missing
          # interrupt-parent/clocks) silently produces a DTB whose codec never probes.
          fetch() {
            curl -fsSL -o "/tmp/canonical-$1" \
              "https://raw.githubusercontent.com/xufooo/zybo-linux/main/kernel/$1"
          }
          fail=0
          # DTS: strip comments and blank lines before comparing (the copy has an extra header note)
          fetch zybo-audio.dts
          strip() { grep -v '^[[:space:]]*//' "$1" | grep -v '^[[:space:]]*$'; }
          if ! diff -u <(strip /tmp/canonical-zybo-audio.dts) \
                       <(strip external/overlays/zybo-audio.dts); then
            echo "::error::external/overlays/zybo-audio.dts has drifted from the zybo-linux canonical version; sync it"
            fail=1
          fi
          # fragment: must be byte-identical
          fetch config.fragment
          if ! diff -u /tmp/canonical-config.fragment \
                       external/board/zybo-revb/linux.fragment; then
            echo "::error::external/board/zybo-revb/linux.fragment has drifted from the zybo-linux canonical version; sync it"
            fail=1
          fi
          [ "$fail" = "0" ] && echo "DTS and config fragment both match the zybo-linux canonical versions"
          exit $fail

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio file flex git libncurses-dev \
            libssl-dev python3 rsync unzip wget

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.DL_DIR }}
          key: br2-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('external/configs/*') }}
          restore-keys: br2-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Clone Buildroot
        run: |
          git clone --depth 1 --branch $BUILDROOT_VERSION \
            https://github.com/buildroot/buildroot.git $BR_DIR

      - name: Configure (BR2_EXTERNAL + defconfig)
        run: |
          cd $BR_DIR
          make BR2_EXTERNAL=$GITHUB_WORKSPACE/external \
               BR2_DL_DIR=$DL_DIR \
               zybo_revb_audio_defconfig
          grep -E 'BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_ARMV7|BR2_TARGET_UBOOT_BOARD_DEFCONFIG|BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION|BR2_TARGET_UBOOT_SPL_NAME' .config

      - name: Fix script permissions
        run: |
          # git may lose the executable bit; Buildroot executes the post-build script directly, so it must be +x
          chmod +x external/board/zybo-revb/post-build.sh buildroot_setup.sh make_bootbin.sh 2>/dev/null || true
          ls -l external/board/zybo-revb/post-build.sh

      - name: Build
        run: |
          cd $BR_DIR
          make BR2_DL_DIR=$DL_DIR -j$(nproc)

      - name: List images
        run: ls -la $BR_DIR/output/images/

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-images
          path: |
            ${{ env.BR_DIR }}/output/images/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.BR_DIR }}/output/build/*/build.log
            ${{ env.BR_DIR }}/output/build/*/config.log
          if-no-files-found: ignore
          retention-days: 7
